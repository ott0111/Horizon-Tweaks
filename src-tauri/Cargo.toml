[package]
name = "horizon-tauri"
version = "1.5.2"
description = "Horizon Tweaks"
edition = "2021"

[lib]
name = "horizon_lib"
crate-type = ["staticlib", "cdylib", "lib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "net"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
futures-util = "0.3"
sysinfo = "0.30"
libloading = "0.8"
widestring = "1"
once_cell = "1"
log = "0.4"
env_logger = "0.11"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
dirs = "5.0"
directories = "5"
discord-rich-presence = "1.0"
jsonwebtoken = { version = "9", features = ["use_pem"] }
rand = "0.8"
tiny_http = "0.12.0"
tauri-plugin-process = "2"
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading"] }
winreg = "0.55"
enigo = "0.2"
rdev = "0.5"
tracing = "0.1"
